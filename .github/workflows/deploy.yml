name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  hostinger:
    name: Hostinger (FTP)
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || 'public_html' }}
    steps:
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - name: Upload index.html
        if: env.FTP_SERVER != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow yes;
            put public/index.html -o $FTP_REMOTE_DIR/index.html;
            bye"
      - name: Skipped
        if: env.FTP_SERVER == ''
        run: echo "FTP_SERVER secret not set; skipping Hostinger FTP deploy."

  vps:
    name: VPS
    runs-on: ubuntu-latest
    env:
      EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_PATH: ${{ secrets.VPS_PATH || '/var/www/rogerioalmeida.com' }}
    steps:
      - name: Trigger Easypanel deploy
        if: env.EASYPANEL_DEPLOY_WEBHOOK != ''
        run: curl -fsS -X POST "$EASYPANEL_DEPLOY_WEBHOOK"

      - uses: actions/checkout@v4
        if: env.EASYPANEL_DEPLOY_WEBHOOK == '' && env.VPS_HOST != ''
      - name: Copy index.html over SSH
        if: env.EASYPANEL_DEPLOY_WEBHOOK == '' && env.VPS_HOST != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          scp -P "$VPS_PORT" -i ~/.ssh/id_deploy public/index.html "$VPS_USER@$VPS_HOST:$VPS_PATH/index.html"

      - name: Skipped
        if: env.EASYPANEL_DEPLOY_WEBHOOK == '' && env.VPS_HOST == ''
        run: echo "No EASYPANEL_DEPLOY_WEBHOOK or VPS_HOST secret set; skipping VPS deploy."

  cloudflare:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy with wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4.20.0 deploy
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set; skipping Cloudflare deploy."
